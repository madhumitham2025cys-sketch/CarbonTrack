<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Activity logs</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between"><h1>Activity logs</h1><a class="btn btn-accent" href="/activity-logs/new">Add activity</a></div><table class="table bg-white mt-3"><tr><th>Date</th><th>Household</th><th>Activity</th><th>Quantity</th><th>kg CO2</th><th></th></tr><tr th:each="log:${logs}"><td th:text="${log.activityDate}"></td><td th:text="${log.household.householdName}"></td><td th:text="${log.activityType}"></td><td th:text="${log.quantity + ' ' + log.unit}"></td><td th:text="${log.calculatedEmission}"></td><td><a th:href="@{'/activity-logs/'+${log.id}}">View</a> <a th:href="@{'/activity-logs/'+${log.id}+'/edit'}">Edit</a> <form class="d-inline" method="post" th:action="@{'/activity-logs/'+${log.id}+'/delete'}" onsubmit="return confirm('Delete this log?')"><button class="btn btn-link text-danger">Delete</button></form></td></tr></table></main></body></html>
