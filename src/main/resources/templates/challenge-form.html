<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Challenge form</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><h1>Challenge</h1><form class="card p-4 col-lg-7" method="post" action="/challenges/save"><input type="hidden" name="id" th:value="${challenge.id}"><input class="form-control mb-2" name="challengeName" th:value="${challenge.challengeName}" placeholder="Challenge name" required><textarea class="form-control mb-2" name="description" placeholder="Description" th:text="${challenge.description}"></textarea><input class="form-control mb-2" name="targetReductionPercentage" type="number" min="1" max="100" step="0.1" th:value="${challenge.targetReductionPercentage}" placeholder="Target %" required><input class="form-control mb-2" name="startDate" type="date" th:value="${challenge.startDate}" required><input class="form-control mb-3" name="endDate" type="date" th:value="${challenge.endDate}" required><button class="btn btn-primary">Save</button></form></main></body></html>
