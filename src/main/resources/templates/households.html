<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Households</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between"><h1>Households</h1><a class="btn btn-accent" href="/households/new">Add household</a></div><form class="row g-2 my-3"><div class="col-md-6"><input class="form-control" name="search" th:value="${search}" placeholder="Search name or owner"></div><button class="btn btn-primary col-auto">Search</button></form><table class="table bg-white"><tr><th>Name</th><th>Owner</th><th>Location</th><th></th></tr><tr th:each="h:${households}"><td th:text="${h.householdName}"></td><td th:text="${h.ownerName}"></td><td th:text="${h.location}"></td><td><a th:href="@{'/households/'+${h.id}}">View</a> <a th:href="@{'/households/'+${h.id}+'/edit'}">Edit</a> <form class="d-inline" method="post" th:action="@{'/households/'+${h.id}+'/delete'}" onsubmit="return confirm('Delete this household and its activity logs?')"><button class="btn btn-link text-danger">Delete</button></form></td></tr></table></main></body></html>
