<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Household form</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><h1>Household</h1><form th:action="@{/households/save}" th:object="${household}" method="post" class="card p-4 col-lg-7"><input type="hidden" th:field="*{id}"><input class="form-control mb-2" th:field="*{householdName}" placeholder="Household name"><small class="text-danger" th:errors="*{householdName}"></small><input class="form-control mb-2" th:field="*{ownerName}" placeholder="Owner name"><input class="form-control mb-2" th:field="*{email}" placeholder="Email"><input class="form-control mb-2" th:field="*{location}" placeholder="Location"><input class="form-control mb-3" type="number" th:field="*{numberOfMembers}" placeholder="Members"><button class="btn btn-primary">Save household</button></form></main></body></html>
