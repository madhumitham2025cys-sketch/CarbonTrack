<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Challenges</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between"><h1>Challenges</h1><a class="btn btn-accent" href="/challenges/new">Add challenge</a></div><table class="table bg-white mt-3"><tr><th>Name</th><th>Target</th><th>Dates</th><th>Status</th><th></th></tr><tr th:each="c:${challenges}"><td th:text="${c.challengeName}"></td><td th:text="${c.targetReductionPercentage + '%'}"></td><td th:text="${c.startDate + ' to ' + c.endDate}"></td><td th:text="${c.status}"></td><td><a th:href="@{'/challenges/'+${c.id}}">View</a> <a th:href="@{'/challenges/'+${c.id}+'/edit'}">Edit</a> <form class="d-inline" method="post" th:action="@{'/challenges/'+${c.id}+'/delete'}" onsubmit="return confirm('Delete this challenge?')"><button class="btn btn-link text-danger">Delete</button></form></td></tr></table></main></body></html>
