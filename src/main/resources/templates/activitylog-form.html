<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Activity log form</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><h1>Activity log</h1><form class="card p-4 col-lg-7" method="post" action="/activity-logs/save"><input type="hidden" name="id" th:value="${log.id}"><select class="form-select mb-2" name="householdId" required><option value="">Choose household</option><option th:each="h:${households}" th:value="${h.id}" th:text="${h.householdName}" th:selected="${log.household != null and log.household.id == h.id}"></option></select><select class="form-select mb-2" name="activityType" required><option value="">Choose type</option><option th:each="type:${types}" th:value="${type}" th:text="${type}" th:selected="${log.activityType == type}"></option></select><input class="form-control mb-2" name="quantity" type="number" step="0.01" min="0.01" th:value="${log.quantity}" placeholder="Quantity" required><input class="form-control mb-2" name="unit" th:value="${log.unit}" placeholder="Unit" required><input class="form-control mb-2" name="activityDate" type="date" th:value="${log.activityDate}" required><input class="form-control mb-3" name="notes" th:value="${log.notes}" placeholder="Notes"><button class="btn btn-primary">Save</button></form></main></body></html>
