<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Leaderboard</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><h1>Monthly reduction leaderboard</h1><p>Ranked by improvement against each household's own previous month.</p><table class="table bg-white"><tr><th>Rank</th><th>Household</th><th>Previous month</th><th>Current month</th><th>Reduction</th></tr><tr th:each="p,stat:${leaderboard}"><td th:text="${stat.count}"></td><td th:text="${p.household.householdName}"></td><td th:text="${p.baselineFootprint}"></td><td th:text="${p.currentFootprint}"></td><td th:text="${#numbers.formatDecimal(p.reductionPercentage,1,1)+'%'}"></td></tr></table></main></body></html>
