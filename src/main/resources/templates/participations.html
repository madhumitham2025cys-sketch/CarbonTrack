<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Participation</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><div class="d-flex justify-content-between"><h1>Participation</h1><a class="btn btn-accent" href="/participations/new">Join challenge</a></div><table class="table bg-white mt-3"><tr><th>Household</th><th>Challenge</th><th>Baseline</th><th>Current</th><th>Reduction</th><th>Status</th><th></th></tr><tr th:each="p:${participations}"><td th:text="${p.household.householdName}"></td><td th:text="${p.challenge.challengeName}"></td><td th:text="${p.baselineFootprint}"></td><td th:text="${p.currentFootprint}"></td><td th:text="${#numbers.formatDecimal(p.reductionPercentage,1,1)+'%'}"></td><td th:text="${p.progressStatus}"></td><td><a th:href="@{'/participations/'+${p.id}}">View</a> <form class="d-inline" method="post" th:action="@{'/participations/'+${p.id}+'/delete'}" onsubmit="return confirm('Remove this participation?')"><button class="btn btn-link text-danger">Delete</button></form></td></tr></table></main></body></html>
