<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Join challenge</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container py-4"><h1>Join challenge</h1><form class="card p-4 col-lg-7" method="post" action="/participations/save"><select class="form-select mb-3" name="householdId" required><option value="">Choose household</option><option th:each="h:${households}" th:value="${h.id}" th:text="${h.householdName}"></option></select><select class="form-select mb-3" name="challengeId" required><option value="">Choose challenge</option><option th:each="c:${challenges}" th:value="${c.id}" th:text="${c.challengeName}"></option></select><button class="btn btn-primary">Join</button></form></main></body></html>
