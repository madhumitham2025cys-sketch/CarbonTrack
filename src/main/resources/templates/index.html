<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>CarbonTrack</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container py-4">
	<section class="hero mb-4">
		<p class="text-uppercase mb-1">Household climate ledger</p>
		<h1>CarbonTrack</h1>
		<p class="lead">Turn everyday activity into a clearer path toward lower emissions.</p>
	</section>

	<div class="row g-3">
		<div class="col-md-4" th:each="item : ${ {'Total Households':households, 'Activity Logs':activities, 'Active Challenges':activeChallenges, 'Challenge Participants':participants, 'This Month kg CO2':thisMonth, 'Best Reduction %':bestReduction} }">
			<div class="card p-3 h-100">
				<small th:text="${item.key}"></small>
				<div class="metric" th:text="${#numbers.formatDecimal(item.value, 1, 1)}"></div>
			</div>
		</div>
	</div>

	<div class="row mt-4 g-4">
		<div class="col-lg-7">
			<h2>Recent activity</h2>
			<table class="table bg-white">
				<thead>
				<tr><th>Household</th><th>Type</th><th>Emission</th></tr>
				</thead>
				<tbody>
				<tr th:each="log : ${recent}">
					<td th:text="${log.household.householdName}"></td>
					<td th:text="${log.activityType}"></td>
					<td th:text="${log.calculatedEmission}"></td>
				</tr>
				</tbody>
			</table>
		</div>
		<div class="col-lg-5">
			<h2>Top reductions</h2>
			<ol class="list-group list-group-numbered">
				<li class="list-group-item" th:each="p : ${leaderboard}"
					th:text="${p.household.householdName + ' - ' + #numbers.formatDecimal(p.reductionPercentage, 1, 1) + '%'}"></li>
			</ol>
		</div>
	</div>
</main>
</body>
</html>
